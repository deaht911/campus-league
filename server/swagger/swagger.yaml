  /matches/{id}/result:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    put:
      tags: [Matches]
      summary: Registrar resultado y cerrar el acta digital (CU-09, RF-011)
      description: >
        Solo el árbitro asignado o un administrador. En fútbol, futsal y baloncesto el marcador se calcula
        automáticamente como la suma de goles o puntos registrados por jugador (el campo `marcador` es opcional
        y, si se envía, debe coincidir). En voleibol se envían los sets ganados (el ganador debe tener 3 y el
        perdedor 0, 1 o 2). En baloncesto y en eliminación directa no se admiten empates. Con `borrador: true`
        se guarda sin cerrar. Con `walkover: true` el equipo presente gana 3-0. Al cerrar la final de un torneo
        de eliminación directa, o el último partido de una liga, el torneo pasa a finalizado.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                marcador:
                  type: object
                  properties:
                    local: { type: integer, minimum: 0 }
                    visitante: { type: integer, minimum: 0 }
                estadisticas:
                  type: array
                  items:
                    $ref: '#/components/schemas/PlayerStat'
                borrador: { type: boolean, description: Guarda como pendiente de confirmación sin actualizar la tabla }
                walkover: { type: boolean }
                ganadorWalkover: { type: string, description: ID del equipo presente }
                motivoWalkover: { type: string, maxLength: 300 }
      responses:
        '200':
          description: Acta cerrada o guardada como borrador
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  match:
                    $ref: '#/components/schemas/Match'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

