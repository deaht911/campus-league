openapi: 3.0.3
info:
  title: Campus League API
  description: >
    API REST para la gestión de torneos deportivos universitarios (UAB).
    Autenticación con JWT (Bearer) y control de acceso por roles (RBAC).
  version: 1.0.0
servers:
  - url: http://localhost:5000/api
    description: Desarrollo local
  - url: https://tu-api-en-produccion.com/api
    description: Producción
tags:
  - name: Auth
    description: Registro, verificación OTP, login y sesión activa
  - name: Users
    description: Administración de usuarios y roles
  - name: Teams
    description: Equipos y plantillas
  - name: Tournaments
    description: Torneos, inscripciones y calendario
  - name: Matches
    description: Partidos, actas, tabla de posiciones y goleadores

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtenido en /auth/login o /auth/verify-otp (expira en 30 min)

  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Descripción del error
        errors:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
              mensaje:
                type: string

    User:
      type: object
      properties:
        _id:
          type: string
          example: 6af15d3572f1ce403f48a2b5
        nombre:
          type: string
          example: Mateo Rivas
        correo:
          type: string
          format: email
          example: mateo@uab.edu.bo
        rol:
          type: string
          enum: [jugador, capitan, organizador, arbitro, administrador]
        facultad:
          type: string
          example: Ingeniería
        codigoEstudiantil:
          type: string
          example: UAB-0001
        estudianteActivo:
          type: boolean
        verificado:
          type: boolean
        activo:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/User'

    Team:
      type: object
      properties:
        _id:
          type: string
        nombre:
          type: string
          example: Los Tornillos
        disciplina:
          type: string
          enum: [futsal, basquetbol, voleibol, futbol, otra]
        facultad:
          type: string
        capitan:
          $ref: '#/components/schemas/User'
        jugadores:
          type: array
          items:
            $ref: '#/components/schemas/Player'
        activo:
          type: boolean
        totalJugadoresActivos:
          type: integer

    Player:
      type: object
      properties:
        usuario:
          $ref: '#/components/schemas/User'
        numeroCamiseta:
          type: integer
          minimum: 0
          maximum: 99
        posicion:
          type: string
        activo:
          type: boolean
        fechaAlta:
          type: string
          format: date-time

    Tournament:
      type: object
      properties:
        _id:
          type: string
        nombre:
          type: string
          example: Copa UAB 2026
        disciplina:
          type: string
          enum: [futsal, basquetbol, voleibol, futbol, otra]
        formato:
          type: string
          enum: [liga, eliminacion]
        fechaInicio:
          type: string
          format: date-time
        fechaFin:
          type: string
          format: date-time
        inscripcionInicio:
          type: string
          format: date-time
        inscripcionFin:
          type: string
          format: date-time
        maxEquipos:
          type: integer
          minimum: 4
          maximum: 64
        minJugadores:
          type: integer
        reglamento:
          type: string
        escenarios:
          type: array
          items:
            type: string
        estado:
          type: string
          enum: [borrador, inscripcion, inscripcion_cerrada, en_curso, finalizado, cancelado]
        calendarioPublicado:
          type: boolean
        organizador:
          type: string

    Registration:
      type: object
      properties:
        _id:
          type: string
        torneo:
          type: string
        equipo:
          type: string
        inscritoPor:
          type: string
        estado:
          type: string
          enum: [pendiente, aprobada, rechazada, lista_espera, cancelada]
        aceptaReglamento:
          type: boolean
        motivoRechazo:
          type: string

    PlayerStat:
      type: object
      properties:
        jugador:
          type: string
        equipo:
          type: string
        goles:
          type: integer
          minimum: 0
        faltas:
          type: integer
          minimum: 0
        tarjetas:
          type: array
          items:
            type: string
            enum: [amarilla, roja]
        destacado:
          type: boolean

    Match:
      type: object
      properties:
        _id:
          type: string
        torneo:
          type: string
        local:
          type: string
        visitante:
          type: string
        fase:
          type: string
          enum: [liga, octavos, cuartos, semifinal, final, tercer_puesto]
        jornada:
          type: integer
        fecha:
          type: string
          format: date-time
        escenario:
          type: string
        arbitro:
          type: string
        estado:
          type: string
          enum: [programado, en_juego, pendiente_confirmacion, finalizado, reprogramado, cancelado]
        marcador:
          type: object
          properties:
            local:
              type: integer
            visitante:
              type: integer
        walkover:
          type: boolean
        estadisticas:
          type: array
          items:
            $ref: '#/components/schemas/PlayerStat'

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: ID del recurso (ObjectId de MongoDB)
    UserIdParam:
      name: userId
      in: path
      required: true
      schema:
        type: string
      description: ID del usuario
    RegIdParam:
      name: regId
      in: path
      required: true
      schema:
        type: string
      description: ID de la inscripción
  responses:
    BadRequest:
      description: Datos inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Token ausente, inválido o expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: El rol no tiene permiso para esta acción
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicto con el estado actual del recurso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:
  /health:
    get:
      tags: [Auth]
      summary: Estado del servicio
      responses:
        '200':
          description: API operativa
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: campus-league-api
                  timestamp:
                    type: string
                    format: date-time

  /auth/register:
    post:
      tags: [Auth]
      summary: Registrar usuario con correo institucional (RF-001)
      description: Crea la cuenta con rol jugador y genera un OTP. En desarrollo el código se devuelve en `otpDesarrollo`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, correo, password]
              properties:
                nombre:
                  type: string
                  minLength: 3
                  maxLength: 100
                  example: Mateo Rivas
                correo:
                  type: string
                  format: email
                  example: mateo@uab.edu.bo
                password:
                  type: string
                  minLength: 8
                  example: Campus2026!
                facultad:
                  type: string
                  example: Ingeniería
                codigoEstudiantil:
                  type: string
                  example: UAB-0100
      responses:
        '201':
          description: Registro exitoso, pendiente de verificación OTP
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
                  otpDesarrollo:
                    type: string
                    description: Solo en entorno no productivo
                    example: '123456'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verificar cuenta con código OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo, codigo]
              properties:
                correo:
                  type: string
                  format: email
                codigo:
                  type: string
                  pattern: '^\d{6}$'
                  example: '123456'
      responses:
        '200':
          description: Cuenta verificada, devuelve el token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/resend-otp:
    post:
      tags: [Auth]
      summary: Reenviar código OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo]
              properties:
                correo:
                  type: string
                  format: email
      responses:
        '200':
          description: Respuesta genérica (no revela si el correo existe)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión (RF-002)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo, password]
              properties:
                correo:
                  type: string
                  format: email
                  example: admin@uab.edu.bo
                password:
                  type: string
                  example: Campus2026!
      responses:
        '200':
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/me:
    get:
      tags: [Auth]
      summary: Usuario de la sesión activa
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Datos del usuario autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /teams:
    get:
      tags: [Teams]
      summary: Listar equipos activos (público)
      parameters:
        - { name: disciplina, in: query, schema: { type: string, enum: [futsal, basquetbol, voleibol, futbol, otra] } }
        - { name: facultad, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: Búsqueda por nombre }
      responses:
        '200':
          description: Lista de equipos
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  count: { type: integer }
                  teams:
                    type: array
                    items:
                      $ref: '#/components/schemas/Team'
    post:
      tags: [Teams]
      summary: Crear equipo; el creador queda como capitán (RF-004)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, disciplina]
              properties:
                nombre: { type: string, minLength: 3, maxLength: 60, example: Los Tornillos }
                disciplina: { type: string, enum: [futsal, basquetbol, voleibol, futbol, otra] }
                facultad: { type: string, example: Ingeniería }
      responses:
        '201':
          description: Equipo creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  team:
                    $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /teams/mine:
    get:
      tags: [Teams]
      summary: Equipos donde el usuario es capitán o jugador activo
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Mis equipos
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  count: { type: integer }
                  teams:
                    type: array
                    items:
                      $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /teams/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Teams]
      summary: Detalle de un equipo (público)
      responses:
        '200':
          description: Equipo con plantilla
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  team:
                    $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Teams]
      summary: Editar equipo (solo capitán o administrador)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre: { type: string }
                facultad: { type: string }
      responses:
        '200':
          description: Equipo actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  team:
                    $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Teams]
      summary: Dar de baja el equipo (baja lógica)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Equipo dado de baja
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /teams/{id}/players:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Teams]
      summary: Agregar jugador a la plantilla por correo (RF-005, RF-006)
      description: Valida que sea estudiante activo y que no pertenezca a otro equipo de la misma disciplina.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo]
              properties:
                correo: { type: string, format: email, example: jugador@uab.edu.bo }
                numeroCamiseta: { type: integer, minimum: 0, maximum: 99 }
                posicion: { type: string, example: Pivot }
      responses:
        '201':
          description: Jugador agregado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  team:
                    $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /teams/{id}/players/{userId}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
      - $ref: '#/components/parameters/UserIdParam'
    put:
      tags: [Teams]
      summary: Editar camiseta o posición de un jugador
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                numeroCamiseta: { type: integer, minimum: 0, maximum: 99 }
                posicion: { type: string }
      responses:
        '200':
          description: Jugador actualizado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Teams]
      summary: Dar de baja a un jugador (baja lógica)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Jugador dado de baja
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tournaments:
    get:
      tags: [Tournaments]
      summary: Listar torneos (público)
      parameters:
        - { name: disciplina, in: query, schema: { type: string } }
        - { name: estado, in: query, schema: { type: string, enum: [borrador, inscripcion, inscripcion_cerrada, en_curso, finalizado, cancelado] } }
      responses:
        '200':
          description: Lista de torneos
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  count: { type: integer }
                  tournaments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tournament'
    post:
      tags: [Tournaments]
      summary: Crear torneo (organizador o administrador) (RF-007)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, disciplina, formato, fechaInicio, fechaFin, inscripcionInicio, inscripcionFin, maxEquipos, reglamento]
              properties:
                nombre: { type: string, example: Copa UAB 2026 }
                disciplina: { type: string, enum: [futsal, basquetbol, voleibol, futbol, otra] }
                formato: { type: string, enum: [liga, eliminacion] }
                fechaInicio: { type: string, format: date, example: '2026-11-20' }
                fechaFin: { type: string, format: date, example: '2026-12-20' }
                inscripcionInicio: { type: string, format: date, example: '2026-11-01' }
                inscripcionFin: { type: string, format: date, example: '2026-11-30' }
                maxEquipos: { type: integer, minimum: 4, maximum: 64, example: 8 }
                minJugadores: { type: integer, example: 5 }
                reglamento: { type: string, example: Reglamento oficial }
                escenarios:
                  type: array
                  items: { type: string }
                  example: [Coliseo UAB, Cancha techada]
      responses:
        '201':
          description: Torneo creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  tournament:
                    $ref: '#/components/schemas/Tournament'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tournaments/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Tournaments]
      summary: Detalle de un torneo (público)
      responses:
        '200':
          description: Torneo, equipos aprobados e indicador de inscripción abierta
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  tournament:
                    $ref: '#/components/schemas/Tournament'
                  equiposAprobados: { type: integer }
                  inscripcionAbierta: { type: boolean }
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Tournaments]
      summary: Editar torneo (organizador dueño o administrador)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tournament'
      responses:
        '200':
          description: Torneo actualizado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tournaments/{id}/status:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    patch:
      tags: [Tournaments]
      summary: Cambiar el estado del torneo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { type: string, enum: [borrador, inscripcion, inscripcion_cerrada, en_curso, finalizado, cancelado] }
      responses:
        '200':
          description: Estado actualizado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tournaments/{id}/registrations:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Tournaments]
      summary: Listar inscripciones (organizador ve todas; capitán solo las suyas)
      security:
        - bearerAuth: []
      parameters:
        - { name: estado, in: query, schema: { type: string, enum: [pendiente, aprobada, rechazada, lista_espera, cancelada] } }
      responses:
        '200':
          description: Inscripciones del torneo
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  count: { type: integer }
                  registrations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Registration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Tournaments]
      summary: Inscribir equipo en el torneo (CU-05, RF-008)
      description: Solo dentro del período de inscripción, con plantilla mínima y jugadores habilitados. Sin cupos queda en lista de espera.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [equipo, aceptaReglamento]
              properties:
                equipo: { type: string, description: ID del equipo }
                aceptaReglamento: { type: boolean, example: true }
      responses:
        '201':
          description: Inscripción registrada (pendiente o lista de espera)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  registration:
                    $ref: '#/components/schemas/Registration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tournaments/{id}/registrations/{regId}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
      - $ref: '#/components/parameters/RegIdParam'
    patch:
      tags: [Tournaments]
      summary: Aprobar o rechazar una inscripción
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { type: string, enum: [aprobada, rechazada, pendiente] }
                motivoRechazo: { type: string, description: Obligatorio al rechazar }
      responses:
        '200':
          description: Inscripción revisada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  registration:
                    $ref: '#/components/schemas/Registration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tournaments/{id}/fixture:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Tournaments]
      summary: Generar calendario en modo borrador (CU-07, RF-009)
      description: Requiere inscripción cerrada y al menos 4 equipos aprobados. Evita choques de escenario y de equipo.
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                escenarios:
                  type: array
                  items: { type: string }
                horarios:
                  type: array
                  items: { type: string, example: '18:00' }
                fechaInicio: { type: string, format: date }
                fechaFin: { type: string, format: date }
                dobleVuelta: { type: boolean, description: Solo formato liga }
                tipoDias: { type: string, enum: [habiles, todos] }
      responses:
        '201':
          description: Calendario generado (borrador)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  total: { type: integer }
                  matches:
                    type: array
                    items:
                      $ref: '#/components/schemas/Match'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Tournaments]
      summary: Descartar el calendario en borrador
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Borrador descartado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tournaments/{id}/fixture/publish:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Tournaments]
      summary: Publicar el calendario en el portal público
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Calendario publicado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
